        html { scroll-behavior: smooth; }

            color: #1f2328;
            min-height: 100vh;
        }
        a { color: inherit; }

        .reader-topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, .94);
            border-bottom: 1px solid #d0d7de;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(31, 35, 40, .06);

        .topbar-inner {
            width: min(1180px, calc(100% - 28px));

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 10px 0;

        .breadcrumbs {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #57606a;
            font-size: 13px;
            line-height: 1.35;
        }
        .breadcrumbs a {
            color: #0969da;
            font-weight: 650;
            text-decoration: none;
        }
        .breadcrumbs a:hover { text-decoration: underline; }
        .crumb-sep { color: #8c959f; }
        .breadcrumbs .crumb-part {
            color: #57606a;
            font-weight: 650;
        }
        .breadcrumbs .crumb-book {
            min-width: 0;
            max-width: 360px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #1f2328;
            font-weight: 700;
        }
        .breadcrumbs .crumb-current {
            min-width: 0;
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #57606a;
            font-weight: 650;
        }

        .top-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex: 0 0 auto;
        }
        .top-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 34px;
            padding: 7px 10px;
            border: 1px solid #d0d7de;
            border-radius: 999px;
            background: #fff;
            color: #0969da;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
            text-decoration: none;

        .top-btn:hover {
            background: #f6f8fa;
            border-color: #0969da;

        }
        .top-btn[disabled] {
            opacity: .45;
            cursor: not-allowed;

        }
        .toc-dropdown {
            position: relative;
            display: inline-flex;
        }
        .toc-menu {
            position: absolute;

            padding: 8px;
            border: 1px solid #d0d7de;
            border-radius: 14px;

        .toc-menu[hidden] { display: none; }
        .toc-menu-title {
            padding: 8px 10px 7px;
            color: #656d76;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .toc-menu a {
            display: block;
            padding: 9px 10px;
            border-radius: 9px;
            color: #1f2328;
            font-size: 13px;
            line-height: 1.35;
            text-decoration: none;
        }
        .toc-menu a:hover {
            background: #ddf4ff;
            color: #0969da;
        }
        .toc-menu a.active {
            background: #0969da;
            color: #fff;
            font-weight: 750;
        }

        .progress-wrap {
            height: 3px;
            background: transparent;
        }
        .progress-bar {
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #0969da, #8250df);

        }

        #main {

            padding: 28px 0 72px;
        }

            border: 1px solid #d0d7de;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            font-size: 13px;
            font-weight: 800;
            letter-spacing: .03em;
            text-transform: uppercase;

        .book-hero h1 {

            margin: 0 0 12px;
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.08;
            letter-spacing: -.02em;
        }
        .book-hero p {
            max-width: 820px;
            color: #57606a;
            font-size: 16px;
            line-height: 1.65;
        }
        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }
        .hero-pill {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 6px 10px;
            border: 1px solid #d0d7de;
            border-radius: 999px;
            background: #fff;
            color: #57606a;
            font-size: 13px;
            font-weight: 650;

            border-radius: 16px;
            background: #fff;

        .toc-head {

            justify-content: space-between;

            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #d0d7de;

        .toc-head h2 {
            font-size: 22px;
            line-height: 1.2;
        }
        .toc-note {
            color: #656d76;
            font-size: 13px;
        }
        .toc-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }
        .toc-section h3 {
            margin-bottom: 8px;
            color: #57606a;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;

        .toc-list {
            display: grid;
            gap: 7px;
            list-style: none;

            padding: 9px 10px;
            border: 1px solid #d8dee4;
            border-radius: 10px;

            font-weight: 650;

            font-size: 14px;
            font-weight: 700;
            line-height: 1.35;

            border-radius: 16px;
            background: #fff;

            align-items: center;
            margin-bottom: 12px;
            padding: 5px 9px;
            border-radius: 999px;
            background: #ddf4ff;
            color: #0969da;
            font-size: 12px;
            font-weight: 800;

        .markdown-body {

            line-height: 1.72;

        }
        .markdown-body h1:first-child { margin-top: 0; }
        .markdown-body h1 { padding-bottom: .35em; border-bottom-color: #d8dee4; }
        .markdown-body h2 { margin-top: 1.65em; }
        .markdown-body table { display: table; width: 100%; overflow: visible; }

        .back-to-top {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 90;
            width: 42px;
            height: 42px;
            border: 1px solid #d0d7de;
            border-radius: 50%;
            background: #fff;
            color: #0969da;
            box-shadow: 0 8px 24px rgba(31, 35, 40, .12);
            cursor: pointer;
            font-size: 18px;
            font-weight: 800;
        }
        .back-to-top:hover { background: #f6f8fa; }

        /* Инлайн-код */
        .markdown-body code:not(pre code) {
            background: #e8f0fe;
            color: #1a56a0;
            border: 1px solid #c5d8f8;
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 0.88em;
        }

        /* Блок кода */
        .markdown-body pre {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 42px 20px 16px;
            overflow-x: auto;
            margin: 14px 0;
            position: relative;
        }
        .markdown-body pre code {
            background: transparent;
            color: #e6edf3;
            border: none;
            padding: 0;
            font-size: 13.5px;
            line-height: 1.6;
        }
        .code-copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #21262d;
            color: #c9d1d9;
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s ease, color .15s ease, border-color .15s ease;
        }
        .code-copy-btn svg { width: 16px; height: 16px; pointer-events: none; }
        .code-copy-btn:hover { background: #30363d; color: #fff; border-color: #8b949e; }
        .code-copy-btn.copied { background: #238636; color: #fff; border-color: #2ea043; }
        .code-copy-btn.failed { background: #da3633; color: #fff; border-color: #f85149; }

        .markdown-body blockquote {
            background: #fff8e6;
            border-left: 4px solid #f0a830;
            border-radius: 0 6px 6px 0;
            padding: 10px 16px;
            color: #4a3800;
            margin: 14px 0;
        }
        .markdown-body blockquote p { margin: 0; }

        @media (max-width: 820px) {
            .topbar-inner { align-items: stretch; flex-direction: column; gap: 8px; padding: 9px 0; }
            .breadcrumbs { width: 100%; }
            .crumb-book { max-width: 42vw; }
            .crumb-current { max-width: 40vw; }
            .top-actions { justify-content: flex-start; flex-wrap: wrap; }
            .top-btn { min-height: 32px; padding: 6px 9px; font-size: 12px; }
            #main { padding-top: 18px; }
            .book-hero, .book-section { padding: 18px; border-radius: 14px; }
            .toc-grid { grid-template-columns: 1fr; }
            .toc-head { align-items: flex-start; flex-direction: column; gap: 6px; }
            .markdown-body table { display: block; overflow-x: auto; }
        }

        @media print {
            @page { margin: 14mm 12mm; }
            html { scroll-behavior: auto; }
            body { background: #fff; color: #000; }
            .reader-topbar, .back-to-top, .code-copy-btn, .hero-meta, .toc-note { display: none !important; }
            #main { width: 100%; padding: 0; margin: 0; }
            .book-hero, .book-toc, .book-section {
                box-shadow: none;
                border: none;
                border-radius: 0;
                padding: 0;
                margin: 0 0 14mm;
                background: #fff;
            }
            .book-hero { page-break-after: always; }
            .book-toc { page-break-after: always; }
            .book-section { break-inside: auto; page-break-before: always; }
            .book-section:first-of-type { page-break-before: auto; }
            .section-label { display: none; }
            .toc-grid { grid-template-columns: 1fr; }
            .toc-list a { border: none; background: #fff; padding: 3px 0; }
            .toc-file { display: none; }
            .markdown-body { font-size: 12pt; line-height: 1.55; }
            .markdown-body pre {
                background: #f6f8fa !important;
                color: #000;
                border: 1px solid #d0d7de;
                white-space: pre-wrap;
                padding: 10px;
            }
            .markdown-body pre code { color: #000; }
            .markdown-body a { color: #000; text-decoration: none; }
        }
    </style>
</head>

let courses = {};

function itemFile(item) { return typeof item === 'string' ? item : item.file; }
function itemTitle(item) {
    if (typeof item !== 'string' && item.title) return item.title;
    return itemFile(item).replace(/\.md$/, '').replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
function courseNumber(key) {
    const match = String(key).match(/^(\d+)-/);
    return match ? parseInt(match[1], 10) : Number.MAX_SAFE_INTEGER;
}
function sortedCourseKeys() {
    return Object.keys(courses).sort((a, b) => {
        const na = courseNumber(a);
        const nb = courseNumber(b);
        return na !== nb ? na - nb : a.localeCompare(b, 'ru');
    });
}
function courseParamFor(key) {
    const idx = sortedCourseKeys().indexOf(key);
    return idx >= 0 ? String(idx + 1) : key;
}
function fileParamFor(filename) {
    if (filename === 'book.md') return 'book';
    const chapter = filename.match(/^chapter-(\d+)\.md$/);
    if (chapter) return String(parseInt(chapter[1], 10));
    const appendix = filename.match(/^appendix-([a-z])\.md$/i);
    if (appendix) return appendix[1].toLowerCase();
    return filename.replace(/\.md$/, '');
}
function sectionIdForFile(filename) { return filename.replace(/\.md$/i, ''); }
function fileFromSectionId(course, sectionId) {
    const items = courses[course] || [];
    return items.map(itemFile).find(fn => sectionIdForFile(fn) === sectionId) || null;
}
function resolveCourseParam(raw) {
    const keys = sortedCourseKeys();
    if (!keys.length) return null;
    if (!raw) return keys[0];
    const value = String(raw).trim().toLowerCase();
    if (courses[value]) return value;
    if (COURSE_ALIASES[value] && courses[COURSE_ALIASES[value]]) return COURSE_ALIASES[value];
    const numeric = Number(value);
    if (Number.isInteger(numeric) && numeric >= 1) {
        const byNum = keys.find(k => courseNumber(k) === numeric);
        if (byNum) return byNum;
        if (numeric <= keys.length) return keys[numeric - 1];
    }
    return keys[0];
}
function resolveFileParam(course, raw) {
    const files = (courses[course] || []).map(itemFile);
    if (!files.length) return null;
    if (!raw && window.location.hash) {
        const fromHash = fileFromSectionId(course, decodeURIComponent(window.location.hash.slice(1)));
        if (fromHash) return fromHash;
    }
    if (!raw) return files.includes('book.md') ? 'book.md' : files[0];
    const value = String(raw).trim().toLowerCase();
    const exact = files.find(fn => fn.toLowerCase() === value || fn.toLowerCase() === value + '.md');
    if (exact) return exact;
    if (value === 'book') return files.includes('book.md') ? 'book.md' : files[0];
    const chapterMatch = value.match(/^c?(?:hapter-)?0*(\d+)$/);
    if (chapterMatch) {
        const n = chapterMatch[1].padStart(2, '0');
        const chapter = files.find(fn => fn === `chapter-${n}.md`);
        if (chapter) return chapter;
    }
    const appendixMatch = value.match(/^(?:app|appendix-)?([a-z])$/);
    if (appendixMatch) {
        const appendix = files.find(fn => fn.toLowerCase() === `appendix-${appendixMatch[1]}.md`);
        if (appendix) return appendix;
    }
    const slug = files.find(fn => fn.replace(/\.md$/, '').toLowerCase() === value);
    return slug || (files.includes('book.md') ? 'book.md' : files[0]);
}
function readRoute() {
    const params = new URLSearchParams(window.location.search);
    const course = resolveCourseParam(params.get('b') || params.get('book'));
    const file = course ? resolveFileParam(course, params.get('c') || params.get('chapter')) : null;
    return { course, file };
}
function sortBookItems(items) {
    return [...items].sort((a, b) => sortScore(itemFile(a)) - sortScore(itemFile(b)) || itemFile(a).localeCompare(itemFile(b), 'ru'));
}
function sortScore(filename) {
    if (filename === 'book.md') return 0;
    const chapter = filename.match(/^chapter-(\d+)\.md$/);
    if (chapter) return 100 + parseInt(chapter[1], 10);
    const appendix = filename.match(/^appendix-([a-z])\.md$/i);
    if (appendix) return 1000 + appendix[1].toLowerCase().charCodeAt(0);
    return 2000;
}
function getPart(course) {
    const n = courseNumber(course);
    return COURSE_PARTS.find(part => n >= part.from && n <= part.to) || { id: '', title: 'Курс' };
}
function getPartTitle(course) {
    return getPart(course).title;
}
function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}
function compactTitle(title) {
    return String(title).replace(/^\d+\s*:\s*/, '').trim();
}
function sectionKind(filename) {
    if (filename === 'book.md') return 'Обзор';
    if (filename.startsWith('appendix-')) return 'Приложение';
    if (filename.startsWith('chapter-')) return 'Глава';
    return 'Раздел';
}
async function fetchChapterText(course, filename) {
    const paths = [`books/${course}/${filename}`, `${course}/${filename}`];
    let lastStatus = 'not found';
    for (const path of paths) {
        const r = await fetch(`${path}?v=${ASSET_VERSION}`);
        if (r.ok) return await r.text();
        lastStatus = 'HTTP ' + r.status + ' for ' + path;
    }
    throw new Error(lastStatus);
}
async function init() {
    try {
        const r = await fetch(`files.json?v=${ASSET_VERSION}`);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        courses = data.courses || {};
        if (!Object.keys(courses).length) throw new Error('Каталог пуст');
        const route = readRoute();
        await loadBook(route.course, route.file, true);
    } catch (err) {
        loadingMsg.innerHTML = `<div class="error-msg">Ошибка загрузки: ${escapeHtml(err.message)}</div>`;
    }
}
async function loadBook(course, preferredFile, replaceUrl = false) {
    currentCourse = course;
    const items = sortBookItems(courses[course] || []);
    const files = items.map(itemFile);
    if (!files.length) throw new Error('В книге нет файлов');
    const targetFile = preferredFile && files.includes(preferredFile) ? preferredFile : (files.includes('book.md') ? 'book.md' : files[0]);
    const bookTitle = itemTitle(items.find(item => itemFile(item) === 'book.md') || items[0]);
    document.title = `${compactTitle(bookTitle)} — DevOps Course`;
    const part = getPart(course);
    breadcrumbPart.textContent = part.title;
    breadcrumbPart.href = part.id ? `index.html#${part.id}` : 'index.html';
    breadcrumbBook.textContent = compactTitle(COURSE_NAMES[course] || bookTitle);
    breadcrumbBook.href = `reader.html?b=${courseParamFor(course)}&c=book#top`;
    breadcrumbCurrent.textContent = 'Загрузка…';
    breadcrumbCurrent.href = '#book-toc';
    loadingMsg.hidden = false;
    contentEl.innerHTML = '';
    loadingMsg.textContent = 'Загружаю главы книги…';

    const loaded = await Promise.all(items.map(async item => {
        const filename = itemFile(item);
        try {
            return { item, filename, text: await fetchChapterText(course, filename), error: null };
        } catch (err) {
            return { item, filename, text: '', error: err };
        }
    }));

    renderFullBook(course, items, loaded, bookTitle);
    renderTopTocMenu(items);
    loadingMsg.hidden = true;
    enhanceCodeBlocks();
    highlightCode();
    currentSections = buildSectionMeta(course, items);
    setupInitialScroll(course, targetFile, replaceUrl);
    updateCurrentSection(true);
}
function buildSectionMeta(course, items) {
    return items.map(item => {
        const filename = itemFile(item);
        return {
            id: sectionIdForFile(filename),
            filename,
            title: itemTitle(item),
            kind: sectionKind(filename),
            el: document.getElementById(sectionIdForFile(filename)),
        };
    }).filter(sec => sec.el);
}
function renderFullBook(course, items, loaded, bookTitle) {
    const chapters = items.filter(item => itemFile(item).startsWith('chapter-'));
    const appendices = items.filter(item => itemFile(item).startsWith('appendix-'));
    const overview = items.filter(item => itemFile(item) === 'book.md');
    const extras = items.filter(item => !itemFile(item).startsWith('chapter-') && !itemFile(item).startsWith('appendix-') && itemFile(item) !== 'book.md');

    const hero = `
        <section class="book-hero" id="top">
            <div class="book-kicker">${escapeHtml(getPartTitle(course))}</div>
            <h1>${escapeHtml(bookTitle)}</h1>
            <p>Книга собрана в одну страницу: можно читать подряд, переходить по оглавлению и экспортировать в PDF через печать браузера.</p>
            <div class="hero-meta">
                <span class="hero-pill">${chapters.length} глав</span>
                <span class="hero-pill">${appendices.length} приложений</span>
                <span class="hero-pill">${items.length} файлов собрано</span>
            </div>
        </section>
    `;

    const toc = `
        <nav class="book-toc" id="book-toc" aria-label="Оглавление книги">
            <div class="toc-head">
                <h2>Оглавление книги</h2>
                <div class="toc-note">Переходы ведут к разделам на этой же странице</div>
            </div>
            <div class="toc-grid">
                ${renderTocGroup('Начало', overview)}
                ${renderTocGroup('Главы', chapters)}
                ${appendices.length ? renderTocGroup('Приложения', appendices) : ''}
                ${extras.length ? renderTocGroup('Дополнительно', extras) : ''}
            </div>
        </nav>
    `;

    const sections = loaded.map(({ item, filename, text, error }) => {
        const id = sectionIdForFile(filename);
        const label = `${sectionKind(filename)} · ${filename}`;
        const body = error
            ? `<div class="error-msg">Не удалось загрузить ${escapeHtml(filename)}: ${escapeHtml(error.message)}</div>`
            : marked.parse(text);
        return `
            <section class="book-section" id="${escapeHtml(id)}" data-file="${escapeHtml(filename)}" data-title="${escapeHtml(itemTitle(item))}">
                <div class="section-label">${escapeHtml(label)}</div>
                ${body}
            </section>
        `;
    }).join('');

    contentEl.innerHTML = hero + toc + sections;
}
function renderTocGroup(title, items) {
    if (!items.length) return '';
    return `
        <section class="toc-section">
            <h3>${escapeHtml(title)}</h3>
            <ul class="toc-list">
                ${items.map(item => {
                    const filename = itemFile(item);
                    const id = sectionIdForFile(filename);
                    return `
                        <li>
                            <a href="#${escapeHtml(id)}" data-target-file="${escapeHtml(filename)}">
                                <span class="toc-file">${escapeHtml(filename)}</span>
                                <span class="toc-title">${escapeHtml(itemTitle(item))}</span>
                            </a>
                        </li>
                    `;
                }).join('')}
            </ul>
        </section>
    `;
}
function renderTopTocMenu(items) {
    const chapters = items.filter(item => itemFile(item).startsWith('chapter-'));
    const appendices = items.filter(item => itemFile(item).startsWith('appendix-'));
    const overview = items.filter(item => itemFile(item) === 'book.md');
    tocMenu.innerHTML = `
        <div class="toc-menu-title">Быстрый переход</div>
        <a href="#book-toc" data-scroll-id="book-toc">Оглавление книги</a>
        ${renderTopTocMenuGroup('Начало', overview)}
        ${renderTopTocMenuGroup('Главы', chapters)}
        ${appendices.length ? renderTopTocMenuGroup('Приложения', appendices) : ''}
    `;
    closeTocMenu();
}
function renderTopTocMenuGroup(title, items) {
    if (!items.length) return '';
    return `
        <div class="toc-menu-title">${escapeHtml(title)}</div>
        ${items.map(item => {
            const filename = itemFile(item);
            const id = sectionIdForFile(filename);
            return `<a href="#${escapeHtml(id)}" data-scroll-id="${escapeHtml(id)}" data-file="${escapeHtml(filename)}">${escapeHtml(itemTitle(item))}</a>`;
        }).join('')}
    `;
}
function openTocMenu() {
    tocMenu.hidden = false;
    tocBtn.setAttribute('aria-expanded', 'true');
}
function closeTocMenu() {
    tocMenu.hidden = true;
    tocBtn.setAttribute('aria-expanded', 'false');
}
function toggleTocMenu() {
    tocMenu.hidden ? openTocMenu() : closeTocMenu();
}
function setActiveTocItem(filename) {
    tocMenu.querySelectorAll('a[data-file]').forEach(a => {
        a.classList.toggle('active', a.dataset.file === filename);
    });
}
function setupInitialScroll(course, targetFile, replaceUrl) {
    const targetId = window.location.hash
        ? decodeURIComponent(window.location.hash.slice(1))
        : sectionIdForFile(targetFile);
    const target = document.getElementById(targetId) || document.getElementById(sectionIdForFile(targetFile));
    updateUrlForFile(course, targetFile, replaceUrl, false);
    requestAnimationFrame(() => {
        if (target && target.id !== 'book') target.scrollIntoView({ block: 'start' });
        else window.scrollTo({ top: 0, behavior: 'auto' });
    });
}
function updateUrlForFile(course, filename, replace = true, includeHash = true) {
    if (!course || !filename) return;
    const next = new URL(window.location.href);
    next.search = '';
    next.searchParams.set('b', courseParamFor(course));
    next.searchParams.set('c', fileParamFor(filename));
    next.hash = includeHash ? sectionIdForFile(filename) : window.location.hash;
    if (next.href === window.location.href) return;
    history[replace ? 'replaceState' : 'pushState']({ course, filename }, '', next);
}
function updateCurrentSection(force = false) {
    if (!currentSections.length) return;
    const marker = window.scrollY + 120;
    let active = currentSections[0];
    for (const sec of currentSections) {
        if (sec.el.offsetTop <= marker) active = sec;
        else break;
    }
    if (force || active.id !== currentSectionId) {
        currentSectionId = active.id;
        breadcrumbCurrent.textContent = active.kind === 'Обзор' ? 'Оглавление' : active.title;
        breadcrumbCurrent.href = `#${active.id}`;
        setActiveTocItem(active.filename);
        updateUrlForFile(currentCourse, active.filename, true, true);
    }
}
function updateProgress() {
    const doc = document.documentElement;
    const max = Math.max(1, doc.scrollHeight - window.innerHeight);
    const percent = Math.min(100, Math.max(0, (window.scrollY / max) * 100));
    progressBar.style.width = percent + '%';
}
function onScroll() {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(() => {
        updateCurrentSection(false);
        updateProgress();
        scrollTicking = false;
    });
}
function scrollToId(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ block: 'start' });
}
function highlightCode() {
    contentEl.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
}
async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
    }
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.top = '-1000px';
    textarea.style.left = '-1000px';
    document.body.appendChild(textarea);
    textarea.select();
    try {
        if (!document.execCommand('copy')) throw new Error('copy failed');
    } finally {
        textarea.remove();
    }
}
const COPY_ICON = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5" y="3" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="1" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>';
const COPY_SUCCESS_ICON = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const COPY_ERROR_ICON = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 4.25v4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="11.75" r=".9" fill="currentColor"/><path d="M8.87 1.88 14.14 11a1 1 0 0 1-.87 1.5H2.73a1 1 0 0 1-.87-1.5l5.27-9.12a1 1 0 0 1 1.74 0Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
function enhanceCodeBlocks() {
    contentEl.querySelectorAll('pre').forEach(pre => {
        const code = pre.querySelector('code');
        if (!code || pre.querySelector('.code-copy-btn')) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'code-copy-btn';
        btn.innerHTML = COPY_ICON;
        btn.setAttribute('aria-label', 'Скопировать код');
        btn.title = 'Скопировать код';
        btn.addEventListener('click', async () => {
            try {
                await copyText(code.textContent);
                btn.innerHTML = COPY_SUCCESS_ICON;
                btn.classList.remove('failed');
                btn.classList.add('copied');
            } catch (err) {
                btn.innerHTML = COPY_ERROR_ICON;
                btn.classList.remove('copied');
                btn.classList.add('failed');
            }
            setTimeout(() => {
                btn.innerHTML = COPY_ICON;
                btn.classList.remove('copied', 'failed');
            }, 1600);
        });
        pre.appendChild(btn);
    });
}

tocBtn.addEventListener('click', event => {
    event.stopPropagation();
    toggleTocMenu();
});
tocMenu.addEventListener('click', event => {
    const link = event.target.closest('a[data-scroll-id]');
    if (!link) return;
    event.preventDefault();
    closeTocMenu();
    scrollToId(link.dataset.scrollId);
});
document.addEventListener('click', event => {
    if (!tocDropdown.contains(event.target)) closeTocMenu();
});
breadcrumbBook.addEventListener('click', event => {
    event.preventDefault();
    closeTocMenu();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (currentCourse) updateUrlForFile(currentCourse, 'book.md', true, false);
});
breadcrumbCurrent.addEventListener('click', event => {
    event.preventDefault();
    const id = breadcrumbCurrent.getAttribute('href')?.replace(/^#/, '');
    if (id) scrollToId(id);
});
pdfBtn.addEventListener('click', () => window.print());
backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('hashchange', () => {
    const id = decodeURIComponent(window.location.hash.slice(1));
    if (id) scrollToId(id);
});
window.addEventListener('popstate', async () => {
    const route = readRoute();
    if (route.course !== currentCourse) await loadBook(route.course, route.file, true);
    else if (route.file) scrollToId(sectionIdForFile(route.file));
});

init();
</script>
